[project]
name = "ai-scratchpad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic[vertex]>=1.2.0",
    "google-cloud-aiplatform[evaluation]>=2.0.1",
    "google-genai>=2.20.0",
    "opentelemetry-api",
    "opentelemetry-exporter-gcp-trace",
    "opentelemetry-instrumentation-google-genai",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-propagator-gcp",
    "opentelemetry-sdk",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "fastapi>=0.141.1",
    "googlemaps>=4.10.0",
    "google-adk[a2a,mcp]>=2.8.0",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
    "ag-ui-adk>=0.7.0",
    "tenacity>=9.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/node_modules", "**/.venv", "**/__pycache__"]

[tool.ruff.lint]
# E4/E7/E9 = import placement + statement/syntax errors, F = pyflakes
# (undefined names, unused imports), B = bugbear, UP = pyupgrade.
select = ["E4", "E7", "E9", "F", "B", "UP"]

