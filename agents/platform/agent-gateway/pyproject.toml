[project]
name = "conversational-banking"
version = "0.1.0"
description = "Enterprise Governed ADK Banking Agent behind Google Cloud Agent Gateway"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[gcp,otel-gcp,agent-identity]>=1.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=0.2.0",
    "aiohttp>=3.10.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.80.0",
    "protobuf>=5.0.0",
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server"]
